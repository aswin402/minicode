<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestDo - Gamified Todo RPG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="game-header">
            <h1 class="game-title">⚔️ QuestDo ⚔️</h1>
            <p class="game-subtitle">Transform Your Tasks Into Epic Adventures</p>
        </header>

        <!-- Character Selection (shown when no character chosen) -->
        <section id="character-select" class="character-select hidden">
            <h2>Choose Your Hero</h2>
            <div class="class-grid">
                <button class="class-card warrior" data-class="warrior">
                    <span class="class-icon">🗡️</span>
                    <h3>Warrior</h3>
                    <div class="class-stats">
                        <div class="stat"><span>STR</span><strong>15</strong></div>
                        <div class="stat"><span>INT</span><strong>8</strong></div>
                        <div class="stat"><span>AGI</span><strong>10</strong></div>
                    </div>
                    <p class="class-passive">+20% XP on hard/epic tasks</p>
                </button>
                <button class="class-card mage" data-class="mage">
                    <span class="class-icon">🔮</span>
                    <h3>Mage</h3>
                    <div class="class-stats">
                        <div class="stat"><span>STR</span><strong>8</strong></div>
                        <div class="stat"><span>INT</span><strong>15</strong></div>
                        <div class="stat"><span>AGI</span><strong>10</strong></div>
                    </div>
                    <p class="class-passive">+INT bonus to all XP</p>
                </button>
                <button class="class-card rogue" data-class="rogue">
                    <span class="class-icon">🗝️</span>
                    <h3>Rogue</h3>
                    <div class="class-stats">
                        <div class="stat"><span>STR</span><strong>10</strong></div>
                        <div class="stat"><span>INT</span><strong>10</strong></div>
                        <div class="stat"><span>AGI</span><strong>15</strong></div>
                    </div>
                    <p class="class-passive">+15% streak multiplier</p>
                </button>
            </div>
            <div class="name-input">
                <label for="hero-name">Hero Name:</label>
                <input type="text" id="hero-name" placeholder="Enter your name..." maxlength="20">
                <button id="confirm-hero" class="btn-primary">Begin Quest!</button>
            </div>
        </section>

        <!-- Main Game Area -->
        <main id="game-area" class="game-area">
            <!-- Stats Panel -->
            <section class="stats-panel">
                <div class="character-info">
                    <span class="class-icon-small" id="char-icon">🗡️</span>
                    <div class="char-details">
                        <h3 id="char-name">Hero</h3>
                        <span class="char-class" id="char-class">Warrior Lv.1</span>
                    </div>
                </div>
                
                <!-- XP Bar -->
                <div class="xp-container">
                    <div class="xp-label">
                        <span>XP</span>
                        <span id="xp-current">0 / 100</span>
                    </div>
                    <div class="xp-bar">
                        <div class="xp-fill" id="xp-fill"></div>
                    </div>
                    <span class="level-badge">Level <span id="current-level">1</span></span>
                </div>

                <!-- Streak Counter -->
                <div class="streak-container" id="streak-display">
                    <span class="streak-flame">🔥</span>
                    <div class="streak-info">
                        <span class="streak-count" id="streak-count">0</span>
                        <span class="streak-label">Day Streak</span>
                    </div>
                    <span class="streak-multiplier" id="streak-multiplier">1.0x</span>
                </div>

                <!-- Sound Toggle -->
                <button id="sound-toggle" class="sound-btn" title="Toggle Sound">
                    🔊
                </button>
            </section>

            <!-- Task Input -->
            <section class="task-input-section">
                <form id="task-form">
                    <input type="text" id="task-input" placeholder="Add a new quest..." required>
                    <select id="difficulty-select">
                        <option value="easy">⚡ Easy (+10 XP)</option>
                        <option value="medium" selected>⚔️ Medium (+25 XP)</option>
                        <option value="hard">💪 Hard (+50 XP)</option>
                        <option value="epic" id="epic-option" disabled>👑 Epic (+100 XP) [Lv.10]</option>
                    </select>
                    <button type="submit" class="btn-add">+ Add Quest</button>
                </form>
            </section>

            <!-- Task List -->
            <section class="task-list-section">
                <h2>📜 Quest Log</h2>
                <div id="task-list" class="task-list">
                    <!-- Tasks will be rendered here -->
                </div>
                <div id="empty-state" class="empty-state">
                    <p>No quests yet! Add your first task to begin your adventure.</p>
                </div>
            </section>

            <!-- Perks Panel -->
            <section class="perks-panel">
                <h2>🏆 Perks</h2>
                <div id="perks-list" class="perks-list">
                    <!-- Perks rendered here -->
                </div>
            </section>
        </main>

        <!-- Celebration Overlay -->
        <div id="celebration-overlay" class="celebration-overlay hidden">
            <div class="celebration-content">
                <h2 id="celebration-title">Level Up!</h2>
                <p id="celebration-message">You reached Level 2!</p>
                <div id="celebration-perk" class="perk-unlock hidden">
                    <span>🔓 New Perk Unlocked!</span>
                    <p id="perk-name"></p>
                </div>
            </div>
        </div>

        <!-- Particle Canvas -->
        <canvas id="particle-canvas"></canvas>
    </div>

    <script src="audio.js"></script>
    <script src="effects.js"></script>
    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
