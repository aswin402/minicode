[package]
name = "minidoctor"
version = "0.1.0"
edition = "2021"
description = "Universal multi-stack native Rust codebase health diagnostic engine & AI remediation CLI for minicode"
authors = ["Aswin"]
license = "MIT OR Apache-2.0"

[lib]
name = "minidoctor"
path = "src/lib.rs"

[[bin]]
name = "minidoctor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
tree-sitter = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.12"
