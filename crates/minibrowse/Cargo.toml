[package]
name = "minibrowse"
version = "0.5.46"
edition = "2021"
description = "Fast, low-RAM agentic browser, research extractor, Web debugger, and Flutter inspector for minicode"
authors = ["Aswin"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "minibrowse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream"] }
scraper = "0.20"
htmd = "0.1"
url = "2.5"
