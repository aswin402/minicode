name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Check Formatting
        run: cargo fmt --all -- --check
        
      - name: Cargo Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy Lints
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --lib --bins --all-features --locked -- -D warnings 2>&1 | tee /tmp/clippy.log; then
            grep -E '^(error|  --> )' /tmp/clippy.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

  test-linux:
    name: Test Suite (Ubuntu)
    needs: check-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Run Tests
        run: cargo test --all-targets --all-features --locked --verbose

  test-macos:
    name: Test Suite (macOS)
    needs: check-and-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Run Tests
        run: cargo test --all-targets --all-features --locked --verbose
