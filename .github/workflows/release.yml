name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to attach release assets to (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build companion binaries (minidoctor, minibrowse)
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
        run: cargo build --release --locked --target ${{ matrix.target }} -j 2 -p minidoctor -p minibrowse

      - name: Build minicode release binary
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "64"
        run: cargo build --release --locked --target ${{ matrix.target }} -j 1 --bin minicode

      - name: Package binaries (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="minicode-${{ matrix.target }}.tar.gz"
          STAGE_DIR="dist/stage-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR" dist

          cp "target/${{ matrix.target }}/release/minicode" "$STAGE_DIR/minicode"
          for extra in minidoctor minibrowse; do
            if [ -f "target/${{ matrix.target }}/release/${extra}" ]; then
              cp "target/${{ matrix.target }}/release/${extra}" "$STAGE_DIR/${extra}"
            fi
          done
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGE_DIR/" 2>/dev/null || cp README.md "$STAGE_DIR/"

          tar -C "$STAGE_DIR" -czf "dist/${ASSET_NAME}" .
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
            else
              shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
            fi
          )
          cat "dist/${ASSET_NAME}.sha256"

      - name: Package binaries (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "${{ matrix.target }}"
          $assetName = "minicode-$target.zip"
          $stageDir = "dist\stage-$target"
          New-Item -ItemType Directory -Force -Path $stageDir, "dist" | Out-Null

          Copy-Item "target\$target\release\minicode.exe" "$stageDir\minicode.exe"
          foreach ($extra in @("minidoctor.exe", "minibrowse.exe")) {
            $src = "target\$target\release\$extra"
            if (Test-Path $src) {
              Copy-Item $src "$stageDir\$extra"
            }
          }
          if (Test-Path "README.md") { Copy-Item "README.md" "$stageDir\README.md" }

          Compress-Archive -Path "$stageDir\*" -DestinationPath "dist\$assetName" -Force
          $hash = (Get-FileHash -Path "dist\$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Out-File -FilePath "dist\$assetName.sha256" -Encoding ascii -NoNewline
          Add-Content -Path "dist\$assetName.sha256" -Value "" -Encoding ascii
          Get-Content "dist\$assetName.sha256"

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/minicode-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/minicode-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified checksums.txt and copy installers
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          cat *.sha256 | sort -k2 > checksums.txt
          cp ../install.sh ./install.sh
          cp ../install.ps1 ./install.ps1
          ls -la
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/minicode-*.tar.gz
            release-assets/minicode-*.tar.gz.sha256
            release-assets/minicode-*.zip
            release-assets/minicode-*.zip.sha256
            release-assets/checksums.txt
            release-assets/install.sh
            release-assets/install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
