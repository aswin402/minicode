<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuestDo — Gamified Todo RPG</title>
  <meta name="description" content="Turn your tasks into legendary quests. Earn XP, level up, and unlock perks as you battle your todos." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <!-- Preconnect for any future fonts -->
  <style>
    /* Critical above-fold loading state */
    body { background:#0d0d14; color:#e8e8f0; font-family:system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .splash { text-align:center; }
    .splash-title { font-size:2.5rem; font-weight:900; color:#f7b731; text-shadow:0 0 20px rgba(247,183,49,.4); margin-bottom:.5rem; }
    .splash-sub { color:#6b6b8a; font-size:1rem; }
    .splash-spinner { margin-top:1.5rem; width:36px; height:36px; border:3px solid #2a2a40; border-top-color:#f7b731; border-radius:50%; animation:spin .8s linear infinite; margin-left:auto; margin-right:auto; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-title">⚔️ QuestDo</div>
    <div class="splash-sub">Loading your adventure...</div>
    <div class="splash-spinner"></div>
  </div>

  <div id="app" aria-live="polite"></div>

  <!-- Module scripts (cache-busted) -->
  <script src="audio.js?v=2"></script>
  <script src="effects.js?v=2"></script>
  <script src="state.js?v=2"></script>
  <script src="app.js?v=2"></script>

  <script>
    // Remove splash screen once app is ready
    window.addEventListener('load', () => {
      const splash = document.getElementById('splash');
      if (splash) {
        setTimeout(() => {
          splash.style.transition = 'opacity .4s';
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }, 600);
      }
    });
  </script>
</body>
</html>
