<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Todo Quest - A gamified task management game where completing daily tasks earns XP and levels up your character">
  <title>Todo Quest - Level Up Your Productivity</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>
  
  <!-- Main App -->
  <div class="app">
    <!-- Header / Character Stats -->
    <header class="header">
      <h1 class="character-name" id="character-name">Adventurer</h1>
      
      <div class="level-badge">
        <span class="level-label">Level</span>
        <span class="level-number" id="level-number">1</span>
      </div>
      
      <div class="xp-container">
        <div class="xp-bar-wrapper">
          <div class="xp-bar-fill" id="xp-progress" style="width: 0%"></div>
        </div>
        <div class="xp-text">
          <span><span id="xp-current">0</span> XP</span>
          <span><span id="xp-needed">100</span> XP to next level</span>
        </div>
      </div>
    </header>
    
    <!-- Streak Counter -->
    <div class="streak-bar">
      <span class="streak-icon" id="streak-icon">🔥</span>
      <span class="streak-count" id="streak-count">0</span>
      <span class="streak-label">day streak</span>
      <span class="streak-multiplier" id="streak-multiplier">×1.0</span>
    </div>
    
    <!-- Task Input -->
    <div class="task-input-container">
      <h2 class="task-input-header">
        <span>⚔️</span>
        <span>New Quest</span>
      </h2>
      
      <form id="add-task-form">
        <div class="task-input-row">
          <input 
            type="text" 
            class="task-input" 
            id="task-input"
            placeholder="What heroic deed awaits you?" 
            autocomplete="off"
            required
          >
        </div>
        
        <div class="tier-selector">
          <button type="button" class="tier-btn active" data-tier="1">Minor (10 XP)</button>
          <button type="button" class="tier-btn" data-tier="2">Simple (20 XP)</button>
          <button type="button" class="tier-btn" data-tier="3">Heroic (35 XP)</button>
          <button type="button" class="tier-btn" data-tier="4">Epic (50 XP)</button>
        </div>
        
        <button type="submit" class="add-task-btn">Accept Quest</button>
      </form>
    </div>
    
    <!-- Task List -->
    <div class="task-list-header">
      <span>Active Quests</span>
      <span class="task-count" id="task-count">0 active</span>
    </div>
    
    <div class="task-list" id="task-list">
      <!-- Tasks will be rendered here -->
    </div>
  </div>
  
  <!-- Stats Footer -->
  <footer class="stats-footer">
    <div class="stat-item">
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-label">Total Completed</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-today">0</div>
      <div class="stat-label">Today</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-streak">0</div>
      <div class="stat-label">Best Streak</div>
    </div>
  </footer>
  
  <!-- Scripts -->
  <script type="module" src="app.js"></script>
</body>
</html>
